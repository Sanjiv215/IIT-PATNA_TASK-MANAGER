<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Student Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <!-- Atmospheric Glow Accent -->
  <div class="ambient-glow"></div>

  <!-- Top Theme Switcher -->
  <div class="auth-nav-top">
    <button type="button" class="btn-theme-toggle" id="theme-toggle-btn" title="Toggle Light / Dark Theme" aria-label="Toggle theme">
      <span id="theme-toggle-icon">🌙</span>
    </button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-header-brand">
      <div class="auth-brand-row">
        <div class="brand-badge">T</div>
        <span class="brand-wordmark">TASK</span>
        <span class="brand-tag">STUDENT OS</span>
      </div>
      <p class="auth-tagline">Create your student workspace to get organized</p>
    </div>

    <div class="card auth-card">
      <h2>Create Your Account</h2>
      <p class="auth-subtext">Join students staying ahead of coursework & assignment deadlines.</p>

      {% if error %}
      <div class="alert alert-danger" role="alert">
        <span>⚠️</span> <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/signup" method="POST" class="auth-form" id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="signup-name" 
            name="name" 
            placeholder="e.g. Alex Johnson" 
            value="{{ name or '' }}" 
            required 
            autocomplete="name"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="signup-email">Academic Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="signup-email" 
            name="email" 
            placeholder="alex.johnson@university.edu" 
            value="{{ email or '' }}" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="signup-password">Password <span class="required">* (min 8 chars)</span></label>
          <div class="password-input-group">
            <input 
              type="password" 
              id="signup-password" 
              name="password" 
              placeholder="••••••••" 
              minlength="8" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="btn-toggle-pw" id="toggle-signup-pw" title="Show / Hide Password" aria-label="Show password">👁️</button>
          </div>
          <!-- Live Password Strength Bar -->
          <div class="pw-strength-meter" id="pw-meter">
            <div class="pw-strength-bar" id="bar-1"></div>
            <div class="pw-strength-bar" id="bar-2"></div>
            <div class="pw-strength-bar" id="bar-3"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="signup-confirm-password" 
            name="confirm_password" 
            placeholder="••••••••" 
            minlength="8" 
            required 
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-auth">
          <span>Create Account &rarr;</span>
        </button>
      </form>

      <div class="auth-footer-link">
        <p>Already have an account? <a href="/login">Log in &rarr;</a></p>
      </div>
    </div>
  </div>

  <script>
    // Theme Manager for Auth Page
    const currentTheme = localStorage.getItem("stm_theme") || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", currentTheme);
    const themeIcon = document.getElementById("theme-toggle-icon");
    if (themeIcon) themeIcon.textContent = currentTheme === "light" ? "☀️" : "🌙";

    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const active = document.documentElement.getAttribute("data-theme") || "dark";
        const next = active === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("stm_theme", next);
        if (themeIcon) themeIcon.textContent = next === "light" ? "☀️" : "🌙";
      });
    }

    // Password Toggle
    const toggleBtn = document.getElementById("toggle-signup-pw");
    const pwInput = document.getElementById("signup-password");
    if (toggleBtn && pwInput) {
      toggleBtn.addEventListener("click", () => {
        const isPassword = pwInput.type === "password";
        pwInput.type = isPassword ? "text" : "password";
        toggleBtn.textContent = isPassword ? "🙈" : "👁️";
      });
    }

    // Live Password Strength Calculator
    const bar1 = document.getElementById("bar-1");
    const bar2 = document.getElementById("bar-2");
    const bar3 = document.getElementById("bar-3");
    if (pwInput && bar1 && bar2 && bar3) {
      pwInput.addEventListener("input", (e) => {
        const val = e.target.value;
        bar1.className = "pw-strength-bar";
        bar2.className = "pw-strength-bar";
        bar3.className = "pw-strength-bar";

        if (val.length === 0) return;

        if (val.length < 8) {
          bar1.classList.add("weak");
        } else if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) {
          bar1.classList.add("strong");
          bar2.classList.add("strong");
          bar3.classList.add("strong");
        } else {
          bar1.classList.add("medium");
          bar2.classList.add("medium");
        }
      });
    }
  </script>
</body>
</html>
