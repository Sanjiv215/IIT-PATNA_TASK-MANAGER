<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Student Task Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-header-brand">
      <div class="brand-logo-circle">🎓</div>
      <h1>Student Task Manager</h1>
      <p class="auth-tagline">Create your student account to get organized</p>
    </div>

    <div class="card auth-card">
      <h2>Create Your Account</h2>
      <p class="auth-subtext">Join thousands of students staying on top of coursework & assignments.</p>

      {% if error %}
      <div class="alert alert-danger" role="alert">
        <span>⚠️</span> <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/signup" method="POST" class="auth-form" id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="signup-name" 
            name="name" 
            placeholder="e.g. Alex Johnson" 
            value="{{ name or '' }}" 
            required 
            autocomplete="name"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="signup-email">Academic Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="signup-email" 
            name="email" 
            placeholder="alex.johnson@university.edu" 
            value="{{ email or '' }}" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="signup-password">Password <span class="required">* (min 8 chars)</span></label>
          <div class="password-input-group">
            <input 
              type="password" 
              id="signup-password" 
              name="password" 
              placeholder="••••••••" 
              minlength="8" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="btn-toggle-pw" id="toggle-signup-pw" title="Show / Hide Password">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="signup-confirm-password" 
            name="confirm_password" 
            placeholder="••••••••" 
            minlength="8" 
            required 
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-auth">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer-link">
        <p>Already have an account? <a href="/login">Log in &rarr;</a></p>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById("toggle-signup-pw");
    const pwInput = document.getElementById("signup-password");
    if (toggleBtn && pwInput) {
      toggleBtn.addEventListener("click", () => {
        const isPassword = pwInput.type === "password";
        pwInput.type = isPassword ? "text" : "password";
        toggleBtn.textContent = isPassword ? "🙈" : "👁️";
      });
    }
  </script>
</body>
</html>
