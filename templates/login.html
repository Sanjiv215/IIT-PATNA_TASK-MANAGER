<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <!-- Atmospheric Glow Accent -->
  <div class="ambient-glow"></div>

  <!-- Top Theme Switcher -->
  <div class="auth-nav-top">
    <button type="button" class="btn-theme-toggle" id="theme-toggle-btn" title="Toggle Light / Dark Theme" aria-label="Toggle theme">
      <span id="theme-toggle-icon">🌙</span>
    </button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-header-brand">
      <div class="auth-brand-row">
        <div class="brand-badge">T</div>
        <span class="brand-wordmark">TASK</span>
        <span class="brand-tag">STUDENT OS</span>
      </div>
      <p class="auth-tagline">Log in to track your coursework & deadlines</p>
    </div>

    <div class="card auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-subtext">Enter your academic email and password to access your dashboard.</p>

      {% if error %}
      <div class="alert alert-danger" role="alert">
        <span>⚠️</span> <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="auth-form" id="login-form">
        <div class="form-group">
          <label for="login-email">Academic Email</label>
          <input 
            type="email" 
            id="login-email" 
            name="email" 
            placeholder="student@university.edu" 
            value="{{ email or '' }}" 
            required 
            autocomplete="email"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-input-group">
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-pw" id="toggle-login-pw" title="Show / Hide Password" aria-label="Show password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-auth">
          <span>Log In &rarr;</span>
        </button>
      </form>

      <div class="auth-footer-link">
        <p>Don't have an account? <a href="/signup">Sign up for free &rarr;</a></p>
      </div>
    </div>
  </div>

  <script>
    // Theme Manager for Auth Page
    const currentTheme = localStorage.getItem("stm_theme") || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", currentTheme);
    const themeIcon = document.getElementById("theme-toggle-icon");
    if (themeIcon) themeIcon.textContent = currentTheme === "light" ? "☀️" : "🌙";

    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const active = document.documentElement.getAttribute("data-theme") || "dark";
        const next = active === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("stm_theme", next);
        if (themeIcon) themeIcon.textContent = next === "light" ? "☀️" : "🌙";
      });
    }

    // Password Toggle
    const toggleBtn = document.getElementById("toggle-login-pw");
    const pwInput = document.getElementById("login-password");
    if (toggleBtn && pwInput) {
      toggleBtn.addEventListener("click", () => {
        const isPassword = pwInput.type === "password";
        pwInput.type = isPassword ? "text" : "password";
        toggleBtn.textContent = isPassword ? "🙈" : "👁️";
      });
    }
  </script>
</body>
</html>
